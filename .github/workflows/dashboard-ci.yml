name: Dashboard CI (API mocked)

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "oms/**"
      - ".github/workflows/dashboard-ci.yml"
  push:
    branches:
      - "impl/**"
      - "claude/**"
    paths:
      - "dashboard/**"
      - "oms/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and Playwright smoke (OMS API mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off

  live-e2e:
    # Real browser -> real dashboard (next start) -> real OMS (uvicorn) -> PostgreSQL. Providers stay mocked in the OMS.
    name: Live end-to-end (dashboard + OMS + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      OMS_PY: python
      OMS_TEST_PG_ADMIN: postgresql+psycopg://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oms/pyproject.toml
      - name: Install OMS
        working-directory: oms
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.live.config.ts --trace off
