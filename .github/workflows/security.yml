name: Security (secrets, dependencies)

on:
  pull_request:
  push:
    branches:
      - "impl/**"
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

  python-deps:
    name: pip-audit (OMS locked dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export lock and audit
        working-directory: oms
        run: |
          uv export --no-dev --no-hashes --format requirements-txt | grep -v '^-e' > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --progress-spinner off

  node-deps:
    name: npm audit (dashboard production dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=moderate
